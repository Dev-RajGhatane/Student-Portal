<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Submission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F6;
    --panel: #FFFFFF;
    --ink: #1F3A5F;
    --ink-dark: #16283F;
    --line: #D3DCE8;
    --text: #24344A;
    --muted: #62748A;
    --ok: #2E7D57;
    --ok-bg: #E7F4ED;
    --err: #B4433A;
    --err-bg: #FBEAE8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    line-height: 1.5;
  }

  header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }

  header h1 {
    margin: 0 0 4px;
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 1.75rem;
    color: var(--ink-dark);
  }

  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  section h2 {
    margin: 0 0 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink-dark);
  }

  .student-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  @media (max-width: 700px) {
    .student-grid { grid-template-columns: 1fr; }
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--paper);
  }

  input[type="text"]:focus {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
    background: var(--panel);
  }

  .field-error {
    color: var(--err);
    font-size: 0.8rem;
    margin-top: 5px;
    display: none;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }

  .tab-btn {
    padding: 9px 18px;
    border: none;
    background: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }

  .tab-btn.active {
    color: var(--ink-dark);
    border-bottom-color: var(--ink);
    font-weight: 500;
  }

  .code-area {
    display: none;
  }

  .code-area.active {
    display: block;
  }

  textarea {
    width: 100%;
    min-height: 220px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88rem;
    color: var(--text);
    background: #FAFBFD;
    resize: vertical;
    tab-size: 2;
  }

  textarea:focus {
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }

  .run-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    border: none;
    border-radius: 7px;
    padding: 11px 22px;
    cursor: pointer;
  }

  .btn-run {
    background: var(--paper);
    color: var(--ink-dark);
    border: 1px solid var(--ink);
  }

  .btn-run:hover { background: #E3E9F2; }

  .btn-submit {
    background: var(--ink);
    color: #fff;
    padding: 13px 26px;
    font-size: 0.95rem;
  }

  .btn-submit:hover { background: var(--ink-dark); }

  .btn-submit:disabled {
    background: #A7B4C6;
    cursor: not-allowed;
  }

  iframe#preview {
    width: 100%;
    height: 340px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
  }

  .submit-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .status {
    font-size: 0.9rem;
    padding: 9px 14px;
    border-radius: 7px;
    display: none;
  }

  .status.show { display: inline-block; }

  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.err { background: var(--err-bg); color: var(--err); }
  .status.pending { background: #EEF1F6; color: var(--muted); border: 1px solid var(--line); }
</style>
</head>
<body>

<header>
  <h1>Project Submission</h1>
  <p>Write your HTML, CSS and JavaScript, preview it, then submit your finished project.</p>
</header>

<main>

  <section>
    <h2>Your details</h2>
    <div class="student-grid">
      <div>
        <label for="studentName">Full name</label>
        <input type="text" id="studentName" placeholder="e.g. Aashish Karki">
        <div class="field-error" id="err-name">Enter your name.</div>
      </div>
      <div>
        <label for="studentClass">Class</label>
        <input type="text" id="studentClass" placeholder="e.g. 9-B">
        <div class="field-error" id="err-class">Enter your class.</div>
      </div>
      <div>
        <label for="studentRoll">Roll no.</label>
        <input type="text" id="studentRoll" placeholder="e.g. 14">
        <div class="field-error" id="err-roll">Enter your roll number.</div>
      </div>
    </div>
  </section>

  <section>
    <h2>Your code</h2>
    <div class="tabs">
      <button class="tab-btn active" data-tab="html">HTML</button>
      <button class="tab-btn" data-tab="css">CSS</button>
      <button class="tab-btn" data-tab="js">JavaScript</button>
    </div>

    <div class="code-area active" id="area-html">
      <textarea id="codeHtml" spellcheck="false" placeholder="&lt;h1&gt;Hello!&lt;/h1&gt;"></textarea>
    </div>
    <div class="code-area" id="area-css">
      <textarea id="codeCss" spellcheck="false" placeholder="h1 { color: teal; }"></textarea>
    </div>
    <div class="code-area" id="area-js">
      <textarea id="codeJs" spellcheck="false" placeholder="console.log('hello');"></textarea>
    </div>

    <div class="run-row">
      <button class="btn-run" id="runBtn">Run &amp; preview</button>
    </div>
  </section>

  <section>
    <h2>Live preview</h2>
    <iframe id="preview" title="Project preview" sandbox="allow-scripts"></iframe>
  </section>

  <section>
    <h2>Submit</h2>
    <div class="submit-bar">
      <button class="btn-submit" id="submitBtn">Submit project</button>
      <span class="status" id="statusMsg"></span>
    </div>
  </section>

</main>

<script>
  // ---- Configuration ----
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAABZYNpgGmh_UZTa7iZELhJwLVd7DfzMU-zVhrATBIMHURR8-yHmJKMpLLMuyereSUQ/exec";

  // ---- Tab switching ----
  var tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabButtons.forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.code-area').forEach(function (a) { a.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('area-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---- Live preview ----
  function renderPreview() {
    var html = document.getElementById('codeHtml').value;
    var css = document.getElementById('codeCss').value;
    var js = document.getElementById('codeJs').value;

    var doc = '<!DOCTYPE html><html><head><style>' + css + '</style></head><body>' +
      html + '<script>' + js + '<' + '/script></body></html>';

    document.getElementById('preview').srcdoc = doc;
  }

  document.getElementById('runBtn').addEventListener('click', renderPreview);

  // Render once on load so the preview isn't blank
  renderPreview();

  // ---- Validation ----
  function validateField(inputId, errorId) {
    var input = document.getElementById(inputId);
    var error = document.getElementById(errorId);
    if (input.value.trim() === '') {
      error.style.display = 'block';
      input.style.borderColor = '#B4433A';
      return false;
    }
    error.style.display = 'none';
    input.style.borderColor = '';
    return true;
  }

  function validateForm() {
    var nameOk = validateField('studentName', 'err-name');
    var classOk = validateField('studentClass', 'err-class');
    var rollOk = validateField('studentRoll', 'err-roll');
    return nameOk && classOk && rollOk;
  }

  // ---- Submission ----
  var submitBtn = document.getElementById('submitBtn');
  var statusMsg = document.getElementById('statusMsg');

  function setStatus(text, kind) {
    statusMsg.textContent = text;
    statusMsg.className = 'status show ' + kind;
  }

  submitBtn.addEventListener('click', function () {
    if (!validateForm()) {
      setStatus('Please fill in your name, class and roll number.', 'err');
      return;
    }

    // Make sure the preview reflects the latest code before submitting
    renderPreview();

    var payload = {
      name: document.getElementById('studentName').value.trim(),
      className: document.getElementById('studentClass').value.trim(),
      rollNo: document.getElementById('studentRoll').value.trim(),
      htmlCode: document.getElementById('codeHtml').value,
      cssCode: document.getElementById('codeCss').value,
      jsCode: document.getElementById('codeJs').value,
      submittedAt: new Date().toISOString()
    };

    submitBtn.disabled = true;
    setStatus('Submitting…', 'pending');

    fetch(SCRIPT_URL, {
      method: 'POST',
      // text/plain avoids a CORS preflight, which Apps Script web apps don't handle
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        submitBtn.disabled = false;
        if (data && data.status === 'success') {
          setStatus('Project submitted successfully!', 'ok');
        } else {
          setStatus('Submission failed: ' + (data && data.message ? data.message : 'unknown error'), 'err');
        }
      })
      .catch(function (err) {
        submitBtn.disabled = false;
        setStatus('Could not reach the submission server. Check your connection and try again.', 'err');
      });
  });
</script>

</body>
</html>
