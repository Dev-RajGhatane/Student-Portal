<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Coding Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --grad-start: #4F46E5;
    --grad-end: #7C3AED;
    --html-color: #F97316;
    --css-color: #3B82F6;
    --js-color: #EAB308;
    --ink: #1E1B3A;
    --muted: #6B7280;
    --line: #E5E7EB;
    --bg: #F5F6FA;
    --panel: #FFFFFF;
    --ok: #16A34A;
    --ok-bg: #E9F9EF;
    --err: #DC2626;
    --err-bg: #FDECEC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  header {
    background: linear-gradient(120deg, var(--grad-start), var(--grad-end));
    color: #fff;
    padding: 40px 24px 46px;
    text-align: center;
  }

  header h1 {
    margin: 0 0 8px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  header p {
    margin: 0;
    font-size: 1rem;
    color: #E9E7FB;
  }

  main {
    max-width: 1180px;
    margin: -26px auto 60px;
    padding: 0 20px;
  }

  section {
    background: var(--panel);
    border-radius: 16px;
    padding: 24px 26px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(31, 41, 55, 0.08);
  }

  section h2 {
    margin: 0 0 18px;
    font-family: 'Poppins', sans-serif;
    font-size: 1.15rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  @media (max-width: 720px) {
    .grid-3 { grid-template-columns: 1fr; }
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    transition: border-color .15s, background .15s;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--grad-start);
    background: #fff;
  }

  .field-error {
    color: var(--err);
    font-size: 0.8rem;
    margin-top: 6px;
    display: none;
  }

  .editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  @media (max-width: 900px) {
    .editor-grid { grid-template-columns: 1fr; }
  }

  .editor-panel, .preview-panel {
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-bar {
    background: #1E1B3A;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tabs {
    display: flex;
    background: #2A2650;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    background: none;
    font-family: 'Fira Code', monospace;
    font-size: 0.82rem;
    font-weight: 500;
    color: #C7C4E8;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }

  .tab-btn[data-tab="html"].active { color: var(--html-color); border-bottom-color: var(--html-color); }
  .tab-btn[data-tab="css"].active  { color: var(--css-color);  border-bottom-color: var(--css-color); }
  .tab-btn[data-tab="js"].active   { color: var(--js-color);   border-bottom-color: var(--js-color); }

  .code-area { display: none; }
  .code-area.active { display: block; }

  textarea {
    width: 100%;
    min-height: 280px;
    padding: 14px;
    border: none;
    font-family: 'Fira Code', monospace;
    font-size: 0.85rem;
    color: #E7E6F5;
    background: #16142B;
    resize: vertical;
    tab-size: 2;
  }

  textarea:focus { outline: none; }

  iframe#preview {
    width: 100%;
    height: 349px;
    border: none;
    background: #fff;
    display: block;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform .1s, box-shadow .1s;
  }

  button:active { transform: translateY(1px); }

  .btn-run { background: #16A34A; color: #fff; }
  .btn-run:hover { background: #128A3E; }

  .btn-clear { background: var(--err); color: #fff; }
  .btn-clear:hover { background: #C42020; }

  .btn-download { background: #2563EB; color: #fff; }
  .btn-download:hover { background: #1D4ED8; }

  .btn-submit {
    background: linear-gradient(120deg, var(--grad-start), var(--grad-end));
    color: #fff;
    padding: 14px 28px;
    font-size: 0.95rem;
    box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
  }

  .btn-submit:hover { box-shadow: 0 10px 24px rgba(124, 58, 237, 0.4); }

  .btn-submit:disabled {
    background: #B7B3D9;
    box-shadow: none;
    cursor: not-allowed;
  }

  .submit-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .status {
    font-size: 0.9rem;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 10px;
    display: none;
  }

  .status.show { display: inline-block; }
  .status.ok { background: var(--ok-bg); color: var(--ok); }
  .status.err { background: var(--err-bg); color: var(--err); }
  .status.pending { background: #EEF0FB; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>💻 Student Coding Project</h1>
  <p>Write HTML, CSS and JavaScript, preview it live, then submit your project</p>
</header>

<main>

  <section>
    <h2>🎓 Student Information</h2>
    <div class="grid-3">
      <div>
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter your full name">
        <div class="field-error" id="err-name">Enter your name.</div>
      </div>
      <div>
        <label for="studentClass">Class</label>
        <input type="text" id="studentClass" placeholder="Example: 9-B">
        <div class="field-error" id="err-class">Enter your class.</div>
      </div>
      <div>
        <label for="studentRoll">Roll Number</label>
        <input type="text" id="studentRoll" placeholder="Enter roll number">
        <div class="field-error" id="err-roll">Enter your roll number.</div>
      </div>
    </div>
  </section>

  <section>
    <h2>📁 Project Title</h2>
    <input type="text" id="projectTitle" placeholder="Example: My Personal Website">
  </section>

  <section>
    <h2>🧑‍💻 Code Editor &amp; Preview</h2>
    <div class="editor-grid">

      <div class="editor-panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="html">HTML</button>
          <button class="tab-btn" data-tab="css">CSS</button>
          <button class="tab-btn" data-tab="js">JavaScript</button>
        </div>
        <div class="code-area active" id="area-html">
          <textarea id="codeHtml" spellcheck="false" placeholder="&lt;div class=&quot;welcome&quot;&gt;&#10;  &lt;h1&gt;Hello Students!&lt;/h1&gt;&#10;  &lt;p&gt;Start creating your project.&lt;/p&gt;&#10;&lt;/div&gt;"></textarea>
        </div>
        <div class="code-area" id="area-css">
          <textarea id="codeCss" spellcheck="false" placeholder="h1 { color: teal; }"></textarea>
        </div>
        <div class="code-area" id="area-js">
          <textarea id="codeJs" spellcheck="false" placeholder="console.log('hello');"></textarea>
        </div>
      </div>

      <div class="preview-panel">
        <div class="panel-bar">🌐 Live Preview</div>
        <iframe id="preview" title="Project preview" sandbox="allow-scripts"></iframe>
      </div>

    </div>

    <div class="btn-row">
      <button class="btn-run" id="runBtn">▶ Run Project</button>
      <button class="btn-clear" id="clearBtn">🗑 Clear</button>
      <button class="btn-download" id="downloadBtn">⬇ Download Project</button>
    </div>
  </section>

  <section>
    <h2>📤 Submit</h2>
    <div class="submit-bar">
      <button class="btn-submit" id="submitBtn">Submit Project</button>
      <span class="status" id="statusMsg"></span>
    </div>
  </section>

</main>

<script>
  // ---- Configuration ----
  var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAABZYNpgGmh_UZTa7iZELhJwLVd7DfzMU-zVhrATBIMHURR8-yHmJKMpLLMuyereSUQ/exec";

  // ---- Tab switching ----
  var tabButtons = document.querySelectorAll('.tab-btn');
  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tabButtons.forEach(function (b) { b.classList.remove('active'); });
      document.querySelectorAll('.code-area').forEach(function (a) { a.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('area-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---- Live preview ----
  function buildDoc() {
    var html = document.getElementById('codeHtml').value;
    var css = document.getElementById('codeCss').value;
    var js = document.getElementById('codeJs').value;
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' + css + '</style></head><body>' +
      html + '<script>' + js + '<' + '/script></body></html>';
  }

  function renderPreview() {
    document.getElementById('preview').srcdoc = buildDoc();
  }

  document.getElementById('runBtn').addEventListener('click', renderPreview);
  renderPreview(); // show something on load

  // ---- Clear ----
  document.getElementById('clearBtn').addEventListener('click', function () {
    document.getElementById('codeHtml').value = '';
    document.getElementById('codeCss').value = '';
    document.getElementById('codeJs').value = '';
    renderPreview();
  });

  // ---- Download project as a standalone HTML file ----
  document.getElementById('downloadBtn').addEventListener('click', function () {
    var title = document.getElementById('projectTitle').value.trim() || 'my-project';
    var safeTitle = title.replace(/[^a-zA-Z0-9]+/g, '_');
    var blob = new Blob([buildDoc()], { type: 'text/html' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = safeTitle + '.html';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  // ---- Validation ----
  function validateField(inputId, errorId) {
    var input = document.getElementById(inputId);
    var error = document.getElementById(errorId);
    if (input.value.trim() === '') {
      error.style.display = 'block';
      input.style.borderColor = '#DC2626';
      return false;
    }
    error.style.display = 'none';
    input.style.borderColor = '';
    return true;
  }

  function validateForm() {
    var nameOk = validateField('studentName', 'err-name');
    var classOk = validateField('studentClass', 'err-class');
    var rollOk = validateField('studentRoll', 'err-roll');
    return nameOk && classOk && rollOk;
  }

  // ---- Submission ----
  var submitBtn = document.getElementById('submitBtn');
  var statusMsg = document.getElementById('statusMsg');

  function setStatus(text, kind) {
    statusMsg.textContent = text;
    statusMsg.className = 'status show ' + kind;
  }

  submitBtn.addEventListener('click', function () {
    if (!validateForm()) {
      setStatus('Please fill in your name, class and roll number.', 'err');
      return;
    }

    renderPreview();

    var payload = {
      name: document.getElementById('studentName').value.trim(),
      className: document.getElementById('studentClass').value.trim(),
      rollNo: document.getElementById('studentRoll').value.trim(),
      projectTitle: document.getElementById('projectTitle').value.trim(),
      htmlCode: document.getElementById('codeHtml').value,
      cssCode: document.getElementById('codeCss').value,
      jsCode: document.getElementById('codeJs').value,
      submittedAt: new Date().toISOString()
    };

    submitBtn.disabled = true;
    setStatus('Submitting…', 'pending');

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        submitBtn.disabled = false;
        if (data && data.status === 'success') {
          setStatus('✅ Project submitted successfully!', 'ok');
        } else {
          setStatus('Submission failed: ' + (data && data.message ? data.message : 'unknown error'), 'err');
        }
      })
      .catch(function () {
        submitBtn.disabled = false;
        setStatus('Could not reach the submission server. Check your connection and try again.', 'err');
      });
  });
</script>

</body>
</html>
